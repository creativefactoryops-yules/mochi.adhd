/* ───────────────────────── GIRL ───────────────────────── */

/* ───────────────────────── CONFETTI ───────────────────────── */
function Confetti({ active, accent }) {
  if (!active) return null;
  const pieces = Array.from({length:16},function(_,i){
    const cs=[accent,'#f472b6','#fbbf24','#34d399','#60a5fa','#a78bfa'];
    return {key:i, color:cs[i%cs.length], left:(4+(i*6.1)%90)+'%', delay:(i*0.13)+'s', dur:(0.7+i%3*0.2)+'s', size:4+(i%4)};
  });
  return (
    <div style={{position:'absolute',top:0,left:0,right:0,height:110,pointerEvents:'none',overflow:'hidden',zIndex:20}}>
      {pieces.map(function(p){ return (
        <div key={p.key} style={{position:'absolute',top:-8,left:p.left,width:p.size,height:p.size,background:p.color,borderRadius:p.key%3===0?'50%':'2px',animation:'confettiFall '+p.dur+' ease-in '+p.delay+' infinite'}} />
      ); })}
    </div>
  );
}

/* ───────────────────────── NOTIF ───────────────────────── */
function Notif({ text, accent, id }) {
  return (
    <div key={id} style={{
      position:'absolute',top:10,left:'50%',
      padding:'8px 18px',borderRadius:20,
      background:'rgba(0,0,0,0.75)',border:'1px solid '+accent+'55',
      backdropFilter:'blur(12px)',
      color:accent,fontSize:13,fontWeight:600,letterSpacing:0.3,
      whiteSpace:'nowrap',zIndex:30,
      boxShadow:'0 4px 16px rgba(0,0,0,0.4)',
      animation:'notifPop 4.5s ease forwards',
    }}>
      {text}
    </div>
  );
}

/* ───────────────────────── TIMER RING ───────────────────────── */
function TimerRing({ elapsed, duration, accent }) {
  const total = duration * 60;
  const pct   = Math.min(elapsed / total, 1);
  const left  = Math.max(total - elapsed, 0);
  const mm    = String(Math.floor(left/60)).padStart(2,'0');
  const ss    = String(left%60).padStart(2,'0');
  const circ  = 2 * Math.PI * 42;
  return (
    <div style={{position:'relative',width:100,height:100,flexShrink:0}}>
      <svg width={100} height={100} style={{transform:'rotate(-90deg)'}}>
        <circle cx={50} cy={50} r={42} fill="none" stroke="rgba(255,255,255,0.06)" strokeWidth={7} />
        <circle cx={50} cy={50} r={42} fill="none" stroke={accent} strokeWidth={7}
          strokeDasharray={circ} strokeDashoffset={circ*(1-pct)}
          strokeLinecap="round"
          style={{transition:'stroke-dashoffset 1s linear',filter:'drop-shadow(0 0 5px '+accent+')'}} />
      </svg>
      <div style={{position:'absolute',inset:0,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center'}}>
        <div style={{fontSize:22,fontWeight:800,color:'#f1f5f9',fontVariantNumeric:'tabular-nums',letterSpacing:-1}}>{mm}:{ss}</div>
        <div style={{fontSize:9,color:'rgba(255,255,255,0.3)',textTransform:'uppercase',letterSpacing:2}}>left</div>
      </div>
    </div>
  );
}

/* ───────────────────────── APP ───────────────────────── */
function App() {
  const [mood,       setMood]       = useState('focus');
  const [pose,       setPose]       = useState('idle');
  const [running,    setRunning]    = useState(false);
  const [elapsed,    setElapsed]    = useState(0);
  const [duration,   setDuration]   = useState(25);
  const [sessions,   setSessions]   = useState(0);
  const [notif,      setNotif]      = useState({ text:'', id:0 });
  const [msgIdx,     setMsgIdx]     = useState(0);

  const md      = MOODS.find(function(m){ return m.id === mood; }) || MOODS[0];
  const accent  = md.accent;
  const total   = duration * 60;
  const isDone  = elapsed >= total && total > 0;

  const timerRef = useRef(null);
  const poseRef  = useRef(null);
  const msgRef   = useRef(null);

  /* focus timer */
  useEffect(function(){
    if (running) {
      timerRef.current = setInterval(function(){
        setElapsed(function(e){
          if (e+1 >= total) {
            clearInterval(timerRef.current);
            setRunning(false);
            setSessions(function(s){ return s+1; });
            triggerPose('dance', 28, '🎉 Session done! You crushed it, dance it out!');
            return total;
          }
          return e+1;
        });
      }, 1000);
    } else {
      clearInterval(timerRef.current);
    }
    return function(){ clearInterval(timerRef.current); };
  }, [running, total]);

  /* rotate msg every 28s */
  useEffect(function(){
    msgRef.current = setInterval(function(){ setMsgIdx(function(i){ return i+1; }); }, 28000);
    return function(){ clearInterval(msgRef.current); };
  }, []);

  function showNotif(text) {
    setNotif(function(n){ return { text:text, id:n.id+1 }; });
  }

  function triggerPose(p, sec, msg) {
    clearTimeout(poseRef.current);
    setPose(p);
    showNotif(msg);
    poseRef.current = setTimeout(function(){
      setPose(function(){ return running ? 'work' : 'idle'; });
    }, sec * 1000);
  }

  function startFocus() { setElapsed(0); setRunning(true); setPose('work'); showNotif('🧠 Focus started! We\'ve got this!'); }
  function pauseFocus() { setRunning(false); setPose('idle'); }
  function resumeFocus(){ setRunning(true); setPose('work'); }
  function resetFocus() { setRunning(false); setElapsed(0); setPose('idle'); }
  function doDance()   { triggerPose('dance', 15, '💃 Dance break! Shake it all out!'); }
  function doEat()     { triggerPose('eat',   14, '🍜 Time to eat — you need fuel!'); }
  function doFeed()    { triggerPose('feed',  12, '🐱 Feeding Mochi! She\'s so excited!'); }

  const msgs   = MSGS[pose] || MSGS.idle;
  const curMsg = msgs[msgIdx % msgs.length];
  const isDancing = pose === 'dance';

  return (
    <div style={{
      width:'100%', minHeight:'100%',
      display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'flex-start',
      padding:'12px 0 24px',
      background: md.bg,
      animation:'fadein 0.5s ease',
    }}>
      <div style={{width:'100%',maxWidth:390,padding:'0 14px',display:'flex',flexDirection:'column',gap:0}}>

        {/* scene */}
        <div style={{position:'relative',width:'100%',paddingTop:'59%',borderRadius:'22px 22px 0 0',overflow:'hidden',border:'1px solid rgba(255,255,255,0.07)',borderBottom:'none',boxShadow:'0 -4px 24px rgba(0,0,0,0.5)'}}>
          <div style={{position:'absolute',inset:0}}>
            <Room mood={mood} pose={pose} accent={accent} />
            <Girl pose={pose} accent={accent} />
            <Cat  pose={pose} accent={accent} />
            <Confetti active={isDancing} accent={accent} />
            {notif.text && <Notif text={notif.text} accent={accent} id={notif.id} />}
          </div>
        </div>

        {/* companion message */}
        <div style={{padding:'9px 18px 7px',textAlign:'center',fontSize:13,color:accent,opacity:0.88,background:'rgba(0,0,0,0.25)',letterSpacing:0.2,animation:'slideup 0.3s ease'}}>
          {curMsg}
        </div>

        {/* controls */}
        <div style={{background:'rgba(255,255,255,0.038)',border:'1px solid rgba(255,255,255,0.07)',borderTop:'1px solid rgba(255,255,255,0.04)',borderRadius:'0 0 22px 22px',padding:'14px 16px 20px',boxShadow:'0 8px 24px rgba(0,0,0,0.4)'}}>

          {/* timer + session controls */}
          <div style={{display:'flex',alignItems:'center',justifyContent:'center',gap:18,marginBottom:14}}>
            <TimerRing elapsed={elapsed} duration={duration} accent={accent} />
            <div style={{display:'flex',flexDirection:'column',gap:8,flex:1}}>
              {/* duration picker */}
              {!running && !isDone && (
                <div style={{display:'flex',gap:5,animation:'slideup 0.3s ease'}}>
                  {[15,25,45,60].map(function(d){
                    return (
                      <button key={d} onClick={function(){ setDuration(d); setElapsed(0); }}
                        style={{flex:1,padding:'4px 0',borderRadius:8,border:'1px solid',fontSize:11,fontWeight:600,cursor:'pointer',transition:'all 0.18s ease',
                          borderColor: duration===d ? accent : 'rgba(255,255,255,0.1)',
                          background:  duration===d ? accent+'20' : 'transparent',
                          color:       duration===d ? accent : 'rgba(255,255,255,0.3)',
                        }}>{d}m</button>
                    );
                  })}
                </div>
              )}
              {/* session count */}
              <div style={{fontSize:11,color:'rgba(255,255,255,0.28)',textAlign:'center'}}>
                {sessions>0 ? '🎯 '+sessions+' session'+(sessions!==1?'s':'')+' done!' : 'Start your first session!'}
              </div>
              {/* main CTA */}
              {!isDone ? (
                <button
                  onClick={running ? pauseFocus : elapsed>0 ? resumeFocus : startFocus}
                  style={{padding:'10px 0',borderRadius:12,border:'none',fontSize:13,fontWeight:700,cursor:'pointer',
                    background:'linear-gradient(135deg,'+accent+','+accent+'88)',
                    color:'#fff',boxShadow:'0 4px 14px '+accent+'44',transition:'all 0.18s ease',
                  }}>
                  {running ? '⏸ Pause' : elapsed>0 ? '▶ Resume' : '▶ Start Focus'}
                </button>
              ) : (
                <button onClick={resetFocus}
                  style={{padding:'10px 0',borderRadius:12,border:'none',fontSize:13,fontWeight:700,cursor:'pointer',
                    background:'linear-gradient(135deg,'+accent+','+accent+'88)',color:'#fff',
                  }}>✨ New Session</button>
              )}
              {elapsed>0 && !isDone && (
                <button onClick={resetFocus}
                  style={{padding:4,border:'none',background:'none',color:'rgba(255,255,255,0.22)',fontSize:11,cursor:'pointer'}}>
                  ↺ reset
                </button>
              )}
            </div>
          </div>

          {/* action buttons */}
          <div style={{display:'flex',gap:7,marginBottom:13}}>
            {[
              {label:'💃 Dance break', fn:doDance},
              {label:'🍜 Eat!',        fn:doEat},
              {label:'🐱 Feed Mochi', fn:doFeed},
            ].map(function(btn){
              return (
                <button key={btn.label} onClick={btn.fn}
                  style={{flex:1,padding:'9px 4px',borderRadius:11,border:'1px solid rgba(255,255,255,0.09)',background:'rgba(255,255,255,0.04)',color:'rgba(255,255,255,0.6)',fontSize:11,fontWeight:600,cursor:'pointer',transition:'all 0.2s ease',
                    lineHeight:1.3,
                  }}>
                  {btn.label}
                </button>
              );
            })}
          </div>

          {/* mood */}
          <div style={{borderTop:'1px solid rgba(255,255,255,0.06)',paddingTop:11}}>
            <div style={{fontSize:9,textTransform:'uppercase',letterSpacing:2,color:'rgba(255,255,255,0.22)',marginBottom:7,textAlign:'center'}}>vibe</div>
            <div style={{display:'flex',gap:5}}>
              {MOODS.map(function(m){
                return (
                  <button key={m.id} onClick={function(){ setMood(m.id); }}
                    style={{flex:1,padding:'7px 3px',borderRadius:10,border:'1px solid',fontSize:10,fontWeight:600,cursor:'pointer',transition:'all 0.2s ease',textAlign:'center',
                      borderColor: mood===m.id ? m.accent : 'rgba(255,255,255,0.07)',
                      background:  mood===m.id ? m.accent+'18' : 'rgba(255,255,255,0.02)',
                      color:       mood===m.id ? m.accent : 'rgba(255,255,255,0.28)',
                    }}>
                    {m.label}
                  </button>
                );
              })}
            </div>
            <div style={{textAlign:'center',fontSize:11,color:'rgba(255,255,255,0.25)',marginTop:7}}>{md.desc}</div>
          </div>
        </div>

      </div>
    </div>
  );
}

/* register service worker */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(function(err){ console.log('SW:', err); });
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
